<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" />
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#glowGrad)" />

  <!-- Inner 9:16 Smartphone Frame Silhouette -->
  <g filter="url(#shadow)">
    <!-- Phone Body -->
    <rect x="156" y="96" width="200" height="320" rx="36" fill="#09090b" stroke="#ffffff" stroke-opacity="0.25" stroke-width="6" />

    <!-- Screen Area -->
    <rect x="168" y="108" width="176" height="296" rx="26" fill="#18181b" />

    <!-- Play/Video Triangle Icon -->
    <polygon points="232,220 304,256 232,292" fill="#f43f5e" />

    <!-- Dynamic Sparkle Accent -->
    <path d="M300 130 Q300 145 315 145 Q300 145 300 160 Q300 145 285 145 Q300 145 300 130 Z" fill="#fbbf24" />
    <path d="M190 350 Q190 360 200 360 Q190 360 190 370 Q190 360 180 360 Q190 360 190 350 Z" fill="#38bdf8" />
  </g>
</svg>
