<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#0062ff" />
      <stop offset="100%" stop-color="#0047d4" />
    </linearGradient>

    <!-- Soft Top Light Highlight -->
    <linearGradient id="topGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
    </linearGradient>

    <!-- Question Mark & Ring Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#001a70" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#blueGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#topGlow)" />

  <!-- White Outer Ring -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="#ffffff" stroke-width="22" filter="url(#softShadow)" />

  <!-- White Question Mark Shape -->
  <g filter="url(#softShadow)">
    <path
      d="M208 190 C208 140, 240 108, 288 108 C340 108, 372 142, 372 186 C372 226, 342 254, 308 278 C280 298, 270 314, 270 338 L270 348 C270 356, 264 362, 256 362 C248 362, 242 356, 242 348 L242 334 C242 300, 258 278, 292 254 C322 232, 340 212, 340 186 C340 158, 318 136, 288 136 C256 136, 238 156, 236 190 C236 198, 230 204, 222 204 L212 204 C204 204, 208 198, 208 190 Z"
      fill="#ffffff"
    />
    <!-- Dot at the bottom -->
    <circle cx="256" cy="410" r="28" fill="#ffffff" />
  </g>
</svg>
